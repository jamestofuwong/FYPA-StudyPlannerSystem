name: Release Local App

# Triggers when a version tag is pushed, e.g. git tag v1.0.0 && git push --tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            python_exe: python3
            venv_bin: .venv/bin
          - os: windows-latest
            platform: win
            python_exe: python
            venv_bin: .venv/Scripts

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── 3. Sync package.json version from git tag ───────────────────────────
      - name: Set version from tag
        run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version --allow-same-version
        shell: bash

      # ── 4. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ── 4b. Apply patches (patch-package skipped by --ignore-scripts above) ──
      - name: Apply patches
        if: matrix.platform == 'win'
        run: npx patch-package

      # ── 5. Download platform-specific Ollama binary ──────────────────────────
      - name: Download Ollama binary
        run: node scripts/download-ollama.js
        env:
          PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. Build Python parser binary ────────────────────────────────────────
      - name: Set up Python venv and install dependencies
        run: |
          ${{ matrix.python_exe }} -m venv core/services/plannerImport/.venv
          core/services/plannerImport/${{ matrix.venv_bin }}/pip install -r core/services/plannerImport/requirements.txt

      - name: Build Python parser binary
        run: node scripts/build-python.js
        env:
          PYTHON_EXECUTABLE: ${{ github.workspace }}/core/services/plannerImport/${{ matrix.venv_bin }}/python

      # ── 7. Build app (Next.js + Electron) ───────────────────────────────────
      - name: Build app
        run: npm run build
        env:
          # Dummy DB URL so Prisma generate succeeds without a real DB
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      # ── 8. Package and publish to GitHub Releases ────────────────────────────
      - name: Package and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: skip code signing (set CSC_LINK + CSC_KEY_PASSWORD for signed builds)
          CSC_IDENTITY_AUTO_DISCOVERY: false
