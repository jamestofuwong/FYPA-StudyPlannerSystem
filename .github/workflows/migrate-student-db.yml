name: Migrate Student Database

# main       -> dev/staging Supabase project  (secret DATABASE_URL_DEV)
# production -> live Supabase project         (secret DATABASE_URL_PROD)
#
# Both secrets must be the DIRECT or SESSION-POOLER connection string (port 5432).
# Prisma migrations do not work through the transaction pooler (port 6543).
# This workflow only applies migrations; it never seeds. Seed manually with `npm run db:seed:prod`.
on:
  push:
    branches: [main, production]
    paths:
      - student/prisma/schema.prisma
      - student/prisma/migrations/**
      - .github/workflows/migrate-student-db.yml
  workflow_dispatch:

jobs:
  migrate-dev:
    name: Migrate dev database
    if: github.ref_name != 'production'
    runs-on: ubuntu-latest
    concurrency: migrate-student-dev
    defaults:
      run:
        working-directory: student
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: student/package-lock.json
      - run: npm ci
      - name: Check secret is set
        run: test -n "$DATABASE_URL" || { echo "DATABASE_URL_DEV secret is missing"; exit 1; }
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}

  migrate-production:
    name: Migrate production database
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    # Add required reviewers under Settings > Environments > production to make this wait for approval.
    environment: production
    concurrency: migrate-student-production
    defaults:
      run:
        working-directory: student
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: student/package-lock.json
      - run: npm ci
      - name: Check secret is set
        run: test -n "$DATABASE_URL" || { echo "DATABASE_URL_PROD secret is missing"; exit 1; }
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
