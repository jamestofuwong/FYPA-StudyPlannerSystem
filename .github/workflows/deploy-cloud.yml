name: Deploy Cloud App

on:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - 'core/**'
      - 'runtime/pdf-parser/**'
      - 'docker-compose*.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CLOUD_IMAGE:      ghcr.io/jamestofuwong/fypa-studyplannersystem/fypa-cloud
  PDF_PARSER_IMAGE: ghcr.io/jamestofuwong/fypa-studyplannersystem/fypa-pdf-parser

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build and push both Docker images to GHCR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Cloud Next.js image ─────────────────────────────────────────────────
      - name: Build and push cloud image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: cloud/Dockerfile
          push: true
          tags: |
            ${{ env.CLOUD_IMAGE }}:sha-${{ github.sha }}
            ${{ env.CLOUD_IMAGE }}:latest
          cache-from: type=gha,scope=cloud
          cache-to: type=gha,scope=cloud,mode=max

      # ── PDF parser sidecar image ────────────────────────────────────────────
      - name: Build and push pdf-parser image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: runtime/pdf-parser/Dockerfile
          push: true
          tags: |
            ${{ env.PDF_PARSER_IMAGE }}:sha-${{ github.sha }}
            ${{ env.PDF_PARSER_IMAGE }}:latest
          cache-from: type=gha,scope=pdf-parser
          cache-to: type=gha,scope=pdf-parser,mode=max

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to EC2
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "~/fypa"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/fypa

            # Log in to GHCR using the PAT (persists across deploys)
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Set image tag for this deploy
            export IMAGE_TAG=sha-${{ github.sha }}

            # Pull new images
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            # Start / restart services
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # Clean up old images
            docker image prune -f
