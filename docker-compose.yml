services:

  # ---------------------------------------------------------------------------
  # PostgreSQL database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-fypa_cloud}
      POSTGRES_USER:     ${POSTGRES_USER:-fypa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fypa} -d ${POSTGRES_DB:-fypa_cloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  # ---------------------------------------------------------------------------
  # PDF parser sidecar
  # Runs process_planner_pdf() with pdfplumber loaded once at startup.
  # The cloud Next.js app calls this via HTTP — no Python runtime needed there.
  # ---------------------------------------------------------------------------
  pdf-parser:
    build:
      context: .
      dockerfile: runtime/pdf-parser/Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s   # give uvicorn time to import pdfplumber on startup

  # ---------------------------------------------------------------------------
  # Cloud Next.js app
  # ---------------------------------------------------------------------------
  cloud:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      pdf-parser:
        condition: service_healthy
    environment:
      DATABASE_URL:        postgresql://${POSTGRES_USER:-fypa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fypa_cloud}
      NODE_ENV:            production
      SCRAPER_SIMULATE:    ${SCRAPER_SIMULATE:-false}
      PLANNER_PDF_DIR:     /app/data/planners
      PLANNER_PARSER_URL:  http://pdf-parser:8001
      ADMIN_USERNAME:          ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH_B64: ${ADMIN_PASSWORD_HASH_B64}
      SESSION_SECRET:          ${SESSION_SECRET}
    volumes:
      - planner_pdfs:/app/data/planners
    ports:
      - "${CLOUD_PORT:-3001}:3001"

volumes:
  postgres_data:
  planner_pdfs:
